
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas | Padaria Somos Gueto</title>
    <link rel="stylesheet" href="/static/css/entrega.css">
</head>
<body>

    <header>
        <img id="logo-h" src="/static/imgs/logo.png" alt="Logo Somos Gueto">

        <nav>
            <a href="produtos">Produtos</a>
            <a href="entregas">Entregas</a>
            <a href="pagamento">Pagamentos</a>
            <a href="login">Sair</a>
        </nav>
    </header>

    <section class="banner">
        <h2>Entrega até você!</h2>
        <p>Receba os produtos fresquinhos da nossa padaria no conforto da sua casa.</p>
    </section>

    <main>

        <h2 class="titulo">Dados para entrega</h2>
        <p class="descricao">Preencha seus dados para receber seu pedido.</p>

        <div class="entrega-container">

            <form action="entregas.html" method="POST">

                <h3>Informações pessoais</h3>

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome completo" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="(00) 00000-0000" required>

                <h3>Endereço de entrega</h3>

                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep"
                       placeholder="Digite seu CEP" required>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade"
                       placeholder="Digite sua cidade" required>

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro"
                       placeholder="Digite seu bairro" required>

                <label for="rua">Rua</label>
                <input type="text" id="rua" name="rua"
                       placeholder="Digite o nome da rua" required>

                <div class="campos-duplos">

                    <div>
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero"
                               placeholder="Nº" required>
                    </div>

                    <div>
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento"
                               placeholder="Casa, apartamento...">
                    </div>

                </div>

                <label for="referencia">Ponto de referência</label>
                <input type="text" id="referencia" name="referencia"
                       placeholder="Ex: próximo à escola">

                <label for="observacao">Observações do pedido</label>
                <textarea id="observacao" name="observacao"
                          placeholder="Alguma informação adicional?"></textarea>

                <button type="submit">Continuar para pagamento</button>

            </form>

        </div>

    </main>

    <footer>
        <p>© 2026 Padaria Somos Gueto | Todos os direitos reservados.</p>
    </footer>

</body>
</html>
