<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Padaria Somos Gueto</title>
    <link rel="stylesheet" href="/static/css/cadastro.css">
</head>
<body>
    <div class="cadastro-container">
        <h1>Crie sua conta</h1>
        <p>Faça parte da nossa padaria</p>

        <form action="/fazer_cadastro" method="POST">

            <label>Nome completo</label>
            <input type="text" name="nome"
                   placeholder="Digite seu nome" required>

            <label>E-mail</label>
            <input type="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label>Telefone</label>
            <input type="tel" name="telefone"
                   placeholder="(00) 00000-0000" required>

            <label>Cidade</label>
            <input type="text" name="cidade"
                   placeholder="Digite sua cidade" required>

            <label>Estado</label>
            <input type="text" name="estado"
                   placeholder="Ex: SP" maxlength="3" required>

            <label>CEP</label>
            <input type="text" name="cep"
                   placeholder="Digite seu CEP" required>

            <label>Data de nascimento</label>
            <input type="date" name="data_nascimento" required>

            <label>Senha</label>
            <input type="password" name="senha"
                   placeholder="Crie uma senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p class="login">
            Já tem uma conta?
            <a href="/login">Faça login</a>
        </p>
    </div>
</body>
</html>
