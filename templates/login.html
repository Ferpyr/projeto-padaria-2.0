<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Padaria Somos Gueto</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <h1>Padaria Somos Gueto</h1>
        <p class="subtitulo">O sabor de um novo dia</p>

        <form id="formLogin" action="/fazer_login" method="POST">

            <label>E-mail</label>
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>

            <label>Senha</label>
            <input
                type="password" name="senha" id="senha" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
            <p id="mensagem"></p>
        </form>
        <p class="cadastro">
            Não tem uma conta?
            <a href="/cadastro">Cadastre-se</a>
        </p>

    </div>

</body>
</html>
